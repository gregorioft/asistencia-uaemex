<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Login Admin</title>

<style>

body{
margin:0;
font-family:'Segoe UI', sans-serif;
background: linear-gradient(135deg, #006341, #00a86b);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* CARD LOGIN */
.login-box{
background:white;
padding:40px;
border-radius:12px;
width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

.login-box h2{
margin-bottom:20px;
color:#006341;
}

/* INPUTS */
input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
outline:none;
}

/* BOTON */
button{
width:100%;
padding:12px;
background:#006341;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#004d2e;
}

/* MENSAJE */
#mensaje{
margin-top:10px;
color:red;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Administrador</h2>

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<button onclick="login()">Ingresar</button>

<p id="mensaje"></p>

</div>

<script>

async function login(){

const user = document.getElementById("user").value;
const pass = document.getElementById("pass").value;

const res = await fetch("/api/admin/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({user, pass})
});

const data = await res.json();

if(data.ok){

// 🔐 guardar sesión
localStorage.setItem("admin", "true");

// ir al panel
window.location.href = "asistencias.html";

}else{
document.getElementById("mensaje").innerText="Credenciales incorrectas";
}

}



</script>

</body>
</html>
