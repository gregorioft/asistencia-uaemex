<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Registrar Asistencia</title>

<style>
body{
margin:0;
font-family:'Segoe UI', sans-serif;
background: linear-gradient(135deg, #006341, #00a86b);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:40px;
width:320px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
color:#006341;
}

#token{
font-size:12px;
color:#777;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#006341;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#004d2e;
}

.ok{color:green;}
.error{color:red;}
</style>

</head>

<body>

<div class="container">

<h2>Registrar Asistencia</h2>

<p id="token"></p>

<input id="cuenta" placeholder="Número de cuenta">

<button onclick="registrar()">Registrar</button>

<p id="mensaje"></p>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

document.getElementById("token").innerText = "Token: " + token;

async function registrar(){

const cuenta = document.getElementById("cuenta").value;
const mensaje = document.getElementById("mensaje");

if(!cuenta){
mensaje.innerText = "Ingresa tu número de cuenta";
mensaje.className = "error";
return;
}

// 📍 obtener ubicación
navigator.geolocation.getCurrentPosition(async (pos)=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

try {

const res = await fetch("/api/asistencia",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
numeroCuenta: cuenta,
token: token,
lat: lat,
lng: lng
})
});

const data = await res.json();

mensaje.innerText = data.message;

if(data.message.includes("Entrada") || data.message.includes("Salida")){
mensaje.className = "ok";
}else{
mensaje.className = "error";
}

} catch (error) {
mensaje.innerText = "Error al conectar";
mensaje.className = "error";
}

}, ()=>{
mensaje.innerText = "Activa tu ubicación";
mensaje.className = "error";
});

}

</script>

</body>
</html>
