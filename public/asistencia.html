<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Registrar Asistencia</title>

<style>

body{
margin:0;
font-family:'Segoe UI', sans-serif;
background: linear-gradient(135deg, #006341, #00a86b);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* CONTENEDOR */
.container{
background:white;
padding:40px;
width:320px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* TITULO */
h2{
color:#006341;
margin-bottom:10px;
}

/* TOKEN */
#token{
font-size:12px;
color:#777;
margin-bottom:10px;
}

/* INPUT */
input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
outline:none;
}

/* BOTON */
button{
width:100%;
padding:12px;
background:#006341;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#004d2e;
}

/* MENSAJE */
#mensaje{
margin-top:15px;
font-weight:bold;
}

/* MENSAJE EXITO */
.ok{
color:green;
}

/* ERROR */
.error{
color:red;
}

</style>

</head>

<body>

<div class="container">

<h2>Registrar Asistencia</h2>

<p id="token"></p>

<input id="cuenta" placeholder="Número de cuenta">

<button onclick="registrar()">Registrar</button>

<p id="mensaje"></p>

</div>

<script>

// 🔹 obtener token
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

// mostrar token
document.getElementById("token").innerText = "Token: " + token;


// 🚀 REGISTRAR
async function registrar(){

const cuenta = document.getElementById("cuenta").value;
const mensaje = document.getElementById("mensaje");

// 🔒 validación
if(!cuenta){
mensaje.innerText = "Ingresa tu número de cuenta";
mensaje.className = "error";
return;
}

try {

const res = await fetch("/api/asistencia",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
numeroCuenta: cuenta,
token: token
})
});

const data = await res.json();

mensaje.innerText = data.message;

// 🔥 colores según respuesta
if(data.message.includes("Entrada") || data.message.includes("Salida")){
mensaje.className = "ok";
}else{
mensaje.className = "error";
}

} catch (error) {

mensaje.innerText = "Error al conectar";
mensaje.className = "error";

}

}

</script>

</body>
</html>
